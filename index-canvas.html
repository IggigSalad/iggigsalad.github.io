<div style="display:none;">
<img id="background-image" src="tree.png">
</div>

<canvas id="myCanvas" width="200px" height="100px">
</canvas>

<script>
const canvas = document.getElementById("myCanvas");
const context = canvas.getContext("2d");
const image = document.getElementById("background-image");

let scale = 1;

const camera = {
   x: 0,
   y: 9999,
   deltaY: 0,
};

// Track the starting Y position of the touch
let touchStartY = 0;

// Capture the initial touch point
canvas.addEventListener('touchstart', (event) => {
   if (event.touches.length === 1) {
      touchStartY = event.touches[0].clientY;
   }
}, { passive: true });

// Track the movement and update the camera scroll
canvas.addEventListener('touchmove', (event) => {
   if (event.touches.length !== 1) {
      return;
   }

   const touchCurrentY = event.touches[0].clientY;
   const deltaY = touchStartY - touchCurrentY;
   touchStartY = touchCurrentY;
   camera.y += deltaY * 3;
}, { passive: true });


/*
   The camera's scroll position is stored locally,
   so the view can remain where it was if returning to this page.
*/
let stored_scroll_y = sessionStorage.getItem('homepage_scroll_y');
if (stored_scroll_y !== null && stored_scroll_y !== NaN) camera.y = stored_scroll_y;

/*
   Update the canvas' internal size when the window is resized.
*/
window.addEventListener('resize', () => {
   const min_view_width = 1280;
   canvas.width = window.innerWidth * window.devicePixelRatio;
   canvas.height = window.innerHeight * window.devicePixelRatio;
   scale = Math.max(canvas.width, min_view_width) / image.naturalWidth;
   scale = Math.max(scale, canvas.height / image.naturalHeight);
});


/*
   Get the scroll wheel's input.
*/
canvas.addEventListener('wheel', (event) => {
   event.preventDefault();
   camera.deltaY = event.deltaY;
}, {
   passive: false
});

function step() {
   let image_width = image.naturalWidth * scale;
   let image_height = image.naturalHeight * scale;
   let image_x = (canvas.width / 2) - (image_width / 2);

   let min_scroll = 0;
   let max_scroll = Math.max(0, image_height - canvas.height);

   camera.y += camera.deltaY * scale;
   camera.y = Math.min(Math.max(camera.y, min_scroll), max_scroll);
   camera.deltaY = 0;

   sessionStorage.setItem('homepage_scroll_y', camera.y);

   context.clearRect(0, 0, canvas.width, canvas.height);
   context.drawImage(image, image_x, -camera.y, image_width, image_height);

   requestAnimationFrame(step);
}

window.addEventListener("load", () => {
   window.dispatchEvent(new Event("resize"));
   requestAnimationFrame(step);
});

let hour = new Date().getHours();
let time_of_day;

if (hour > 6 && hour <= 18) {
   time_of_day = "day";
} else {
   time_of_day = "night";
}

if (time_of_day == "night") {
   document.body.style.backgroundColor = "midnightblue";
}
</script>

</body>
