<canvas id="myCanvas" width="200px" height="100px">
</canvas>

<script>
const canvas = document.getElementById("myCanvas");
const context = canvas.getContext("2d");
let global_scale = 1;

function load_image(url) {
   const image_element = new Image();
   image_element.src = url;
   return image_element;
}

const background_image = load_image("tree.png");
//const iggig_image = load_image("iggig-relaxed.png");

// Update the canvas' internal size when the window is resized.
window.addEventListener('resize', () => {
   const min_view_width = 1280;
   const pixel_ratio = window.devicePixelRatio;

   canvas.width = window.innerWidth * pixel_ratio;

   global_scale = Math.max(canvas.width, min_view_width * pixel_ratio) / background_image.naturalWidth;
   global_scale = Math.max(global_scale, window.innerHeight * pixel_ratio / background_image.naturalHeight);

   canvas.height = Math.max(window.innerHeight * pixel_ratio, background_image.naturalHeight * global_scale);
   canvas.style.height = (canvas.height / pixel_ratio) + "px";
});

function draw_sprite(sprite, x, y) {
   const draw_x = x;//(x - sprite.offset.x) * global_scale - camera.x;
   const draw_y = -camera.y;(y - sprite.offset.y) * global_scale - camera.y;

   const width = sprite.image.naturalWidth * global_scale;
   const height = sprite.image.naturalHeight * global_scale;

   context.drawImage(sprite.image, draw_x, draw_y, width, height);
}

function step() {
   // Clear the canvas.
   context.clearRect(0, 0, canvas.width, canvas.height);

   // Draw the background.
   const _width = background_image.naturalWidth * global_scale;
   const _height = background_image.naturalHeight * global_scale;
   const _x = (canvas.width / 2) - (_width / 2);
   const _y = 0;
   context.drawImage(background_image, _x, _y, _width, _height);

/*
   context.globalCompositeOperation = "overlay";

   context.beginPath();
   context.arc(mouse_x, mouse_y, 100, 0, Math.PI * 2, true); // Outer circle
   let my_gradient = context.createRadialGradient(mouse_x, mouse_y, 5, mouse_x, mouse_y, 100);
   my_gradient.addColorStop(0, "black");
   my_gradient.addColorStop(0.5, "red");
   my_gradient.addColorStop(1, "white");
   context.fillStyle = my_gradient;
   context.fill();
   context.globalCompositeOperation = "source-over";
*/

   requestAnimationFrame(step);
}

const first_visit = !sessionStorage.getItem('homepage_was_visited');


window.addEventListener("load", () => {
   window.dispatchEvent(new Event("resize"));

   requestAnimationFrame(() => {
      if (first_visit) {
         sessionStorage.setItem('homepage_was_visited', true);
         window.scrollTo(0, document.documentElement.scrollHeight);
      }

      step();
   });
});

let hour = new Date().getHours();
let time_of_day;

if (hour > 6 && hour <= 18) {
   time_of_day = "day";
} else {
   time_of_day = "night";
}

if (time_of_day == "night") {
   document.body.style.backgroundColor = "midnightblue";
}
