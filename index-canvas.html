      width: 100%;
      height: 100%;
      image-rendering: pixelated;
   }
</style>

<body>

<div style="display:none;">
<img id="background-image" src="tree.png">
</div>

<canvas id="myCanvas" width="200px" height="100px">
</canvas>

<script>
const canvas = document.getElementById("myCanvas");
const context = canvas.getContext("2d");
const image = document.getElementById("background-image");

let scale = 1;

const camera = {
   x: 0,
   y: 9999,
   deltaY: 0,
};

/*
   The camera's scroll position is stored locally,
   so the view can remain where it was if returning to this page.
*/
let stored_scroll_y = sessionStorage.getItem('homepage_scroll_y');
if (stored_scroll_y !== null && stored_scroll_y !== NaN) camera.y = stored_scroll_y;

/*
   Use the scroll wheel's input to scroll the camera.
*/
canvas.addEventListener('wheel', (event) => {
   event.preventDefault();
   camera.deltaY = event.deltaY;
}, {
   passive: false
});

/*
   Track the starting Y position of touch input.
*/
let touch_start_y = 0;

canvas.addEventListener('touchstart', (event) => {
   if (event.touches.length === 1) {
      touch_start_y = event.touches[0].clientY;
   }
}, {
   passive: true
});

/*
   Use touch input to scroll the camera.
*/
canvas.addEventListener('touchmove', (event) => {
   if (event.touches.length !== 1) {
      return;
   }

   const touch_current_y = event.touches[0].clientY;
   const deltaY = touch_start_y - touch_current_y;
   touch_start_y = touch_current_y;
   camera.deltaY = deltaY;
}, {
   passive: true
});

/*
   Update the canvas' internal size when the window is resized.
*/
window.addEventListener('resize', () => {
   const min_view_width = 1280;
   canvas.width = window.innerWidth * window.devicePixelRatio;
   canvas.height = window.innerHeight * window.devicePixelRatio;
   scale = Math.max(canvas.width, min_view_width) / image.naturalWidth;
   scale = Math.max(scale, canvas.height / image.naturalHeight);
});

function step() {
   const image_width = image.naturalWidth * scale;
   const image_height = image.naturalHeight * scale;
   const image_x = (canvas.width / 2) - (image_width / 2);

   const min_scroll = 0;
   const max_scroll = Math.max(0, image_height - canvas.height);

   camera.y += camera.deltaY * scale;
   camera.y = Math.min(Math.max(camera.y, min_scroll), max_scroll);
   camera.deltaY = 0;

   sessionStorage.setItem('homepage_scroll_y', camera.y);

   context.clearRect(0, 0, canvas.width, canvas.height);
   context.drawImage(image, image_x, -camera.y, image_width, image_height);
context.globalCompositeOperation = "overlay";
//   context.clearRect(x, y, 128, 128);
   context.beginPath();
   context.arc(x, y, 100, 0, Math.PI * 2, true); // Outer circle
   let my_gradient = context.createRadialGradient(x, y, 5, x, y, 100);
   my_gradient.addColorStop(0, "black");
   my_gradient.addColorStop(0.5, "red");
   my_gradient.addColorStop(1, "white");
   context.fillStyle = my_gradient;
   context.fill();
context.globalCompositeOperation = "source-over";
   requestAnimationFrame(step);
}

window.addEventListener("load", () => {
   window.dispatchEvent(new Event("resize"));
   requestAnimationFrame(step);
});

let x = 0;
let y = 0;

canvas.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    
    // Calculate coordinates relative to the canvas
    x = event.clientX - rect.left;
    y = event.clientY - rect.top;
});

let hour = new Date().getHours();
let time_of_day;

if (hour > 6 && hour <= 18) {
   time_of_day = "day";
} else {
   time_of_day = "night";
}

if (time_of_day == "night") {
   document.body.style.backgroundColor = "midnightblue";
}
</script>

</body>
