<div style="display:none;">
<img id="scream" src="tree.png">
</div>

<canvas id="myCanvas" width="200px" height="100px">
</canvas>

<script>
const canvas = document.getElementById("myCanvas");
const context = canvas.getContext("2d");
const image = document.getElementById("scream");

const min_view_width = 1280;
let scale = 1;

const camera = {
   x: 0,
   y: 9999,
   deltaY: 0,
};

// Track the starting Y position of the touch
let touchStartY = 0;

// Capture the initial touch point
canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) { 
        touchStartY = e.touches[0].clientY;
    }
}, { passive: true });

// Track the movement and update the camera scroll
canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) {
        const touchCurrentY = e.touches[0].clientY;
        
        // Calculate how far the finger moved
        // Inverting this (touchStartY - touchCurrentY) matches natural mobile scrolling
        const deltaY = touchStartY - touchCurrentY;

        // --- INTEGRATE WITH YOUR EXISTING CODE ---
        // Replace 'camera.y' with your project's actual camera/scroll Y variable
        camera.y += deltaY; 
        
        // If you have a bounding function or limits, apply it here:
        // camera.y = Math.max(0, Math.min(camera.y, maxScrollHeight));
        // -----------------------------------------

        // Update the starting point for the next frame of the drag
        touchStartY = touchCurrentY;

        // Trigger your existing draw/render function to update the canvas canvas view
        draw(); 
    }
}, { passive: true });


/*
   The camera's scroll position is stored locally,
   so the view can remain where it was if returning to this page.
*/
let stored_scroll_y = sessionStorage.getItem('homepage_scroll_y');
if (stored_scroll_y != null) camera.y = stored_scroll_y;

/*
   Update the canvas' internal size when the window is resized.
*/
function update_canvas_size() {
   canvas.width = window.innerWidth * window.devicePixelRatio;
   canvas.height = window.innerHeight * window.devicePixelRatio;
   scale = Math.max(canvas.width, min_view_width) / 1920;
}

window.addEventListener('resize', update_canvas_size);
update_canvas_size();

/*
   Get the scroll wheel's input.
*/
canvas.addEventListener('wheel', (event) => {
   event.preventDefault();
   camera.deltaY =/*+=*/ event.deltaY;
}, {
   passive: false
});

function step() {
   let _image_width = 1920 * scale;
   let _image_height = 1920 * scale;

   let _x = (canvas.width / 2) - (_image_width / 2);
   // Calculates maximum upward scroll limit based on the height differences
   let maxScroll = Math.max(0, _image_height - canvas.height);

   // Update scroll position and lock inside boundaries
   camera.y = Math.min(Math.max(camera.y + (camera.deltaY * scale), 0), maxScroll);
//   camera.deltaY = 0;
   sessionStorage.setItem('homepage_scroll_y', camera.y);

   // Wipes the canvas clean before redraws to prevent smearing
   context.clearRect(0, 0, canvas.width, canvas.height);

   // Draw the tree image based on the scroll camera position
   // -camera.y moves the drawing context upwards as you scroll down
   context.drawImage(image, _x, -camera.y, _image_width, _image_height);

   requestAnimationFrame(step);
}

window.addEventListener("load", () => {
   requestAnimationFrame(step);
});

let hour = new Date().getHours();
let time_of_day;

if (hour > 6 && hour <= 18) {
   time_of_day = "day";
} else {
   time_of_day = "night";
}

if (time_of_day == "night") {
   document.body.style.backgroundColor = "midnightblue";
}
</script>
