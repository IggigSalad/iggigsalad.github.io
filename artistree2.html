<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Iggig Salad - &#9835; Music Gallery &#9835;</title>

<style>

body {
   font-family: "Times New Roman", Times, serif;
   min-width: 768px;
}

h2 {
   text-align: center;
}

.song,
.song-highlighted {
   margin: 4pt auto;
   padding: 4pt 4pt 4pt 16pt;
   gap: 4pt;
   display: flex;
   justify-content: space-between;
   width: 320px;
   border-style: dotted;
   border-radius: 32px;
}

.song {
   border-color: blue;
   color: blue;
}

.song-highlighted {
   border-color: red;
   background-color: lightyellow;
   color: red;
}

.header {
   font-weight: bold;
   font-size: 14pt;
}

</style>

</head>

<body>

<h2>&#9835; Music Gallery &#9835;</h2>

<audio id="audio-player" controls style="display: flex; margin: auto;"></audio>


<!-- Template for songs -->

<div class="song" id="song-template">

   <div>
      <span class="header">&#9834;</span>
      <marquee class="album"></marquee>
   </div>

   <button style="border-radius:32px;">Play</button>

</div>


<script>

var song_list = [
   {
      title: "File Select",
      album: "Kirby 64: The Crystal Shards",
      source: "https://lambda.vgmtreasurechest.com/soundtracks/kirby-the-crystal-shards/juvxdcsrrb/1-02.%20File%20Select.mp3"
   },
   {
      title: "King Dedede's Castle",
      album: "Kirby 64: The Crystal Shards",
      source: "King Dedede's Castle.mp3"
   },
   {
      title: "On The Beach",
      album: "Yoshi's Story",
      source: "https://lambda.vgmtreasurechest.com/soundtracks/yoshi-s-story-nintendo-64-gamerip/hylelgioau/05.%20On%20The%20Beach.mp3"
   },
   {
      title: "Come Back To Me",
      album: "Yoshi's Story",
      source: "https://lambda.vgmtreasurechest.com/soundtracks/yoshi-s-story-nintendo-64-gamerip/mpznddqujp/17.%20Come%20Back%20To%20Me.mp3"
   },
   {
      title: "Rock Star",
      album: "Kirby 64: The Crystal Shards",
      source: "https://lambda.vgmtreasurechest.com/soundtracks/kirby-the-crystal-shards/isteyjcmma/1-22.%20Rock%20Star.mp3"
   },
   {
      title: "Ruins",
      album: "Kirby 64: The Crystal Shards",
      source: "https://lambda.vgmtreasurechest.com/soundtracks/kirby-the-crystal-shards/twmqtorusz/1-23.%20Ruins.mp3"
   },
   {
      title: "Overworld of Hyrule",
      album: "The Legend of Zelda",
      source: "https://lambda.vgmtreasurechest.com/soundtracks/the-legend-of-zelda-nes/xrrhlksi/02.%20Overworld%20of%20Hyrule.mp3"
   },
   {
      title: "Mondo Greens",
      album: "[REMIX] Kirby's Dream Land",
      source: "Mondo Greens.wav"
   },
   {
      title: "To Be Continued",
      album: "Poke&#769;mon",
      source: "To Be Continued.mp3"
   }
];


var audio_player = document.getElementById("audio-player");
var song_template = document.getElementById("song-template");

var current_song = -1;


// Remove the template from the page.
song_template.remove();


// Create the song entries.
for (var i = 0; i < song_list.length; i++) {

   var song = song_list[i];
   var element = song_template.cloneNode(true);

   element.dataset.index = i;

   element.children[0].children[0].innerHTML = song.title;
   element.children[0].children[1].innerHTML = song.album;

   element.children[1].addEventListener("click", function() {

      current_song = Number(this.parentElement.dataset.index);

      audio_player.src = song_list[current_song].source;
      audio_player.play();

   });

   document.body.appendChild(element);

}


// Highlight the currently playing song.
audio_player.addEventListener("play", function() {

   var songs = document.querySelectorAll(".song-highlighted");

   for (var i = 0; i < songs.length; i++) {
      songs[i].classList.remove("song-highlighted");
      songs[i].classList.add("song");
   }

   if (current_song >= 0) {

      var element =
         document.querySelector('[data-index="' + current_song + '"]');

      element.classList.remove("song");
      element.classList.add("song-highlighted");

   }

});


// Remove the highlight when the player is paused.
audio_player.addEventListener("pause", function() {

   var element =
      document.querySelector('[data-index="' + current_song + '"]');

   if (element) {
      element.classList.remove("song-highlighted");
      element.classList.add("song");
   }

});


// Automatically play the next song when one ends.
audio_player.addEventListener("ended", function() {

   current_song =
      (current_song + 1) % song_list.length;

   audio_player.src = song_list[current_song].source;
   audio_player.play();

});

</script>

&#9655;

<br />
<br />

</body>

</html>
