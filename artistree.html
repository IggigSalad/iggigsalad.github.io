// When an audio player is being played, all other audio players will be stopped.
document.addEventListener('play', function(_player) {

   // Change the class of the audio player that is playing, so it appears highlighted.
   var _element = _player.target.parentElement;
   _element.classList.remove("song");
   _element.classList.add("song-highlighted");

   // Loop through each audio element.
   var _audio_players = document.getElementsByTagName('audio');
   for (var _i = 0; _i < _audio_players.length; _i++) {
      var _audio_player = _audio_players[_i];

      // If this audio player is the one that started playing, then skip it.
      if (_audio_player == _player.target) {
         continue;
      }

      // Pause this audio player and reset it to the beginning.
      _audio_player.pause();
      _audio_player.currentTime = 0;
   }
}, true);

// When one of our audio players has been paused, change its class, so it no longer appears highlighted.
document.addEventListener('pause', function(_player) {
      var _element = _player.target.parentElement;
      _element.classList.remove("song-highlighted");
      _element.classList.add("song");
}, true);

//
document.addEventListener('ended', function(_player) {
   var _next_audio_player_index = 0;
   var _audio_players = document.getElementsByTagName('audio');

   for (var _i = 0; _i < _audio_players.length; _i++) {
      var _audio_player = _audio_players[_i];

      // If this audio player is the one that started playing, then skip it.
      if (_audio_player == _player.target) {
         _next_audio_player_index = (_i + 1) % _audio_players.length;
         break;
      }
   }

   // Play the next song on the page.
   var _next_audio_player = _audio_players[_next_audio_player_index];
   _next_audio_player.play();

}, true);

</script>

for (var _i = 0; _i < song_list.length; _i++) {
