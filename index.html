<script>
let first_visit = !sessionStorage.getItem('homepage_was_visited');
sessionStorage.setItem('homepage_was_visited', true);

window.addEventListener("load", () => {
   if first_visit {
      document.body.scrollTop = 9999;
   }
});

let hour = new Date().getHours();
let time_of_day;

if (hour > 6 && hour <= 18) {
   time_of_day = "day";
} else {
   time_of_day = "night";
}

if (time_of_day == "night") {
   document.body.style.backgroundColor = "midnightblue";
}
