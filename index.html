<script>
/*
   When the page loads, and the page hasn't been visited before, scroll to the bottom.
*/
window.addEventListener("load", () => {
   let first_visit = !sessionStorage.getItem('page_was_visited');
   sessionStorage.setItem('page_was_visited', true);
   
   if (first_visit) {
      document.documentElement.scrollTop = 9999;
   }
});


let hour = new Date().getHours();
let time_of_day;

if (hour > 6 && hour <= 18) {
   time_of_day = "day";
} else {
   time_of_day = "night";
}

if (time_of_day == "night") {
   document.body.style.backgroundColor = "midnightblue";
}
</script>
